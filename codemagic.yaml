workflows:
  ios-release:
    name: Linovia iOS Release Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: enefsi inc.
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.linovia
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods Dependencies
        script: |
          echo "Installing CocoaPods for Unity LevelPlay & Unity Ads..."
          rm -rf Pods Podfile.lock
          pod install --repo-update

      - name: Set up code signing settings on Xcode project
        script: |
          echo "Configuring App Store profiles via Codemagic..."
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          echo "Building production IPA..."
          xcode-project build-ipa \
            --workspace "Linovia.xcworkspace" \
            --scheme "Linovia"

    artifacts:
      - build/ios/ipa/*.ipa
      - /Users/builder/export/*.ipa
      - "*.ipa"

    publishing:
      email:
        recipients:
          - yatay158@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
